Set-Content -Path "docker-compose.yml" -Value @"
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clinic_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinic_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: clinic_api
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/clinic_booking
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
"@